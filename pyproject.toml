[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-kb-skill"
version = "1.9.0"
description = "Cross-platform AI agent skill for managing an Obsidian personal knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Spc-jgs" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["scripts"]

[project.scripts]
obsidian-audit-vault = "scripts.audit_vault:main"
obsidian-process-inbox = "scripts.process_inbox:main"
obsidian-suggest-links = "scripts.suggest_links:main"
obsidian-create-note = "scripts.create_note:main"
obsidian-update-note = "scripts.update_note:main"

[tool.uv]
required-version = "==0.11.26"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
