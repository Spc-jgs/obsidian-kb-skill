[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-kb-skill"
version = "1.23.0"
description = "Cross-platform AI agent skill for managing an Obsidian personal knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Spc-jgs" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["obsidian_kb_skill*"]
namespaces = true

[tool.setuptools.package-data]
"obsidian_kb_skill.scripts.resources" = ["templates/**/*", "references/**/*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store", "**/.DS_Store"]

[project.scripts]
obsidian-audit-vault = "obsidian_kb_skill.scripts.audit_vault:main"
obsidian-capture-receipt = "obsidian_kb_skill.scripts.capture_receipt:main"
obsidian-process-inbox = "obsidian_kb_skill.scripts.process_inbox:main"
obsidian-search-vault = "obsidian_kb_skill.scripts.search_vault:main"
obsidian-suggest-links = "obsidian_kb_skill.scripts.suggest_links:main"
obsidian-create-category = "obsidian_kb_skill.scripts.create_category:main"
obsidian-create-note = "obsidian_kb_skill.scripts.create_note:main"
obsidian-update-note = "obsidian_kb_skill.scripts.update_note:main"
obsidian-vault-info = "obsidian_kb_skill.scripts.vault_info:main"
obsidian-template-contract = "obsidian_kb_skill.scripts.template_contract:main"
obsidian-detect-index = "obsidian_kb_skill.scripts.detect_index:main"
obsidian-scaffold-templates = "obsidian_kb_skill.scripts.scaffold_templates:main"

[tool.uv]
required-version = "==0.11.26"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]
