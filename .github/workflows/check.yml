name: build-check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  adapters-in-sync:
    name: Adapters in sync with core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify generated adapters match source
        run: python build.py --check
