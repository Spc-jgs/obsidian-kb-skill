name: build-check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  environment-check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Verify generated adapters match source
        run: uv run --no-sync python build.py --check

      - name: Run pytest
        run: uv run --no-sync python -m pytest tests/ -v

  windows-installer:
    name: Windows installer and Python 3.11
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify generated artifacts match source
        run: python build.py --check

      - name: Exercise PowerShell installer outside the checkout
        shell: powershell
        run: tests/windows_installer_smoke.ps1

      - name: Run pytest on Windows
        run: python -m pytest tests/ -v
